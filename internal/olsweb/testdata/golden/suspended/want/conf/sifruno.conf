virtualhost sifruno-paused {
  vhRoot                  /var/lib/sifruno-suspended/
  configFile              /usr/local/lsws/conf/vhosts/sifruno-paused/vhconf.conf
  allowSymbolLink         1
  enableScript            0
  restrained              1
  setUIDMode              2
  user                    pauseduser
  group                   pauseduser
}

listener sifruno-http {
  address                 *:80
  secure                  0
  map                     sifruno-paused paused.example.org, www.paused.example.org
}

listener sifruno-https {
  address                 *:443
  secure                  1
  keyFile                 /etc/sifruno/tls/listener-privkey.pem
  certFile                /etc/sifruno/tls/listener-fullchain.pem
  certChain               1
  map                     sifruno-paused paused.example.org, www.paused.example.org
}
