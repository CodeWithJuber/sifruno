# Generated by Sifruno from its site database. Do not edit: the next render replaces this file.
# Site paused (suspended), user pauseduser, PHP 8.2

docRoot                   /var/lib/sifruno-suspended/

index  {
  useServer               0
  indexFiles              index.php, index.html
  autoIndex               0
}

errorlog /usr/local/lsws/logs/sifruno/paused/error.log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
  keepDays                30
}

accesslog /usr/local/lsws/logs/sifruno/paused/access.log {
  useServer               0
  logReferer              1
  logUserAgent            1
  rollingSize             10M
  keepDays                30
  compressArchive         0
}

module cache {
  ls_enabled              0
  checkPublicCache        0
  checkPrivateCache       0
  enableCache             0
  enablePrivateCache      0
}

context /.well-known/acme-challenge/ {
  location                /var/lib/sifruno-acme/
  allowBrowse             1
  autoIndex               0
  forceType               text/plain
  rewrite  {
    enable                0
  }
}

rewrite  {
  enable                  1
  autoLoadHtaccess        0
  rules                   <<<END_rules
RewriteRule .* - [F,L]
  END_rules
}
