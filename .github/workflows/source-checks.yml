name: Source checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Go, UI and fixture source checks
    # The owner's runner (github-runners kit). GitHub bills its hosted runners in a private
    # repository, and the account's $0 budget stops them.
    runs-on: [self-hosted, linux, x64, sifruno]
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Workflows use nothing GitHub bills for
        run: bash scripts/ci/no-github-billing.sh
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version: '1.27.1'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: '24.19.0'
      - name: Go tests
        run: |
          # The process test rebuilds with -trimpath under a short startup deadline.
          # Prime this runner's local compiler cache from a cold checkout.
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/sifruno-ci" ./cmd/sifruno
          go test ./... -count=1
      - name: Go vet
        run: go vet ./...
      - name: Install pinned development dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix web ci --ignore-scripts --no-audit --no-fund
      - name: UI typecheck and build
        run: |
          npm run panel:typecheck
          npm run panel:build
      - name: Private session, schedule and restore preview UI contract checks
        run: node --test web/src/lib/sites-api.test.mjs web/src/lib/access-api.test.mjs web/src/lib/backupSchedule.test.mjs web/src/lib/restorePreview.test.mjs
      - name: Runtime package policy and controller layout report checks
        run: node --test scripts/runtime-package.test.mjs lab/controller-layout-guest/report.test.mjs
      - name: Native preview tool identities and report checks
        run: node --test lab/native-web-preview-guest/tool-pins.test.mjs lab/native-web-preview-guest/report.test.mjs
      - name: Approved brand integrity
        run: npm run brand:check
      - name: Python fixture checks
        run: |
          python3 -m unittest discover -s lab -p test_capture.py
          python3 -m unittest discover -s lab/hostweb-review -p test_web_runtime_fixture.py
          python3 -m unittest discover -s lab -p test_web_package_prepare.py
          python3 lab/native-restore-preview-review/prepare_test.py
      - name: Packaging and whitespace checks
        run: |
          node scripts/build-runtime.mjs --self-check
          node scripts/package-source.mjs
          git diff --check

# These checks run on the owner's runner, which keeps its caches between runs. They do not activate hosting,
# call paid providers, deploy a preview, qualify native daemons or certify parity.
