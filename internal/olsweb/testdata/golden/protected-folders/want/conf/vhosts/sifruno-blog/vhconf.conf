# Generated by Sifruno from its site database. Do not edit: the next render replaces this file.
# Site blog (active), user blogowner, PHP 8.3

docRoot                   /home/blogowner/public_html/
namespace                 2
cgroups                   2

index  {
  useServer               0
  indexFiles              index.php, index.html
  autoIndex               0
}

errorlog /usr/local/lsws/logs/sifruno/blog/error.log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
  keepDays                30
}

accesslog /usr/local/lsws/logs/sifruno/blog/access.log {
  useServer               0
  logReferer              1
  logUserAgent            1
  rollingSize             10M
  keepDays                30
  compressArchive         0
}

extprocessor sifruno-blog {
  type                    lsapi
  address                 uds://tmp/lshttpd/sifruno-blog.sock
  maxConns                4
  env                     PHP_LSAPI_CHILDREN=4
  env                     LSAPI_AVOID_FORK=200M
  initTimeout             60
  retryTimeout            0
  persistConn             1
  respBuffer              0
  autoStart               2
  path                    /usr/local/lsws/lsphp83/bin/lsphp
  backlog                 100
  instances               1
  runOnStartUp            0
  extUser                 blogowner
  extGroup                blogowner
  priority                0
  memSoftLimit            2047M
  memHardLimit            2047M
  procSoftLimit           1000
  procHardLimit           1000
}

scripthandler  {
  add                     lsapi:sifruno-blog php
}

module cache {
  ls_enabled              1
  storagePath             /var/lib/sifruno-lscache/sifruno-blog
  checkPublicCache        1
  checkPrivateCache       1
  enableCache             0
  enablePrivateCache      0
  qsCache                 1
  reqCookieCache          1
  respCookieCache         1
  ignoreReqCacheCtrl      1
  ignoreRespCacheCtrl     0
  expireInSeconds         3600
  privateExpireInSeconds  3600
  maxStaleAge             200
  maxCacheObjSize         10000000
}

context /.well-known/acme-challenge/ {
  location                /var/lib/sifruno-acme/
  allowBrowse             1
  autoIndex               0
  forceType               text/plain
  rewrite  {
    enable                0
  }
}

realm sifruno-realm2 {
  userDB  {
    location              /var/lib/sifruno-realms/blog/realm2.htpasswd
  }
}

realm sifruno-realm3 {
  userDB  {
    location              /var/lib/sifruno-realms/blog/realm3.htpasswd
  }
}

context exp:(?s)^/internal/.* {
  allowBrowse             1
  accessControl  {
    allow                 192.0.2.0/24, 198.51.100.7, 2001:db8::/32
    deny                  ALL
  }
  rewrite  {
    enable                0
  }
}

context exp:(?s)^/members/.* {
  allowBrowse             1
  realm                   sifruno-realm2
  authName                Members only
  required                valid-user
  accessControl  {
    allow                 ALL
  }
  rewrite  {
    enable                0
  }
}

context exp:(?s)^/staff/.* {
  allowBrowse             1
  realm                   sifruno-realm3
  authName                Staff
  required                user alice bob
  accessControl  {
    allow                 ALL
    deny                  203.0.113.0/24
  }
  rewrite  {
    enable                0
  }
}

context exp:(?s)^/wp-content/plugins/akismet/(?!(?:[^/.]+/)*(?:akismet[.]css|akismet[.]js|form[.]js|logo-a-2x[.]png)(?!.)).* {
  location                /var/lib/sifruno-suspended/
  allowBrowse             0
  rewrite  {
    enable                0
  }
}

context exp:(?s)^/wp-content/uploads/private[.]files/.* {
  location                /var/lib/sifruno-suspended/
  allowBrowse             0
  rewrite  {
    enable                0
  }
}

rewrite  {
  enable                  1
  autoLoadHtaccess        1
  rules                   <<<END_rules
RewriteRule (^|/)\.(ht|git|svn|hg) - [F,L,NC]
RewriteRule (^|/)\.env - [F,L,NC]
RewriteRule (^|/)\.user\.ini$ - [F,L,NC]
RewriteRule (^|/)\.?wp-config\.php(~|\.[^/]*)$ - [F,L,NC]
RewriteRule (^|/)wp-config\.(bak|old|orig|save|swp|txt)$ - [F,L,NC]
RewriteRule (^|/)wp-content/debug\.log$ - [F,L,NC]
  END_rules
}
