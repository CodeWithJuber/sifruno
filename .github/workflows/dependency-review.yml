name: Dependency review

# Fails a pull request that adds a dependency with a known vulnerability of
# moderate severity or worse, from GitHub's advisory database.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: New dependencies have no known vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Review the dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
