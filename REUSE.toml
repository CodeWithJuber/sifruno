version = 1

# Everything in this repository is original Sifruno work under the AGPL,
# except the files the later annotations name. When several annotations
# match a file, the last one wins.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Juber Shaikh (Hostlelo)"
SPDX-License-Identifier = "AGPL-3.0-only"

# shadcn/ui component source added with the shadcn CLI (web/NOTICE.md),
# with Sifruno's changes.
[[annotations]]
path = "web/src/components/ui/**"
precedence = "override"
SPDX-FileCopyrightText = ["2023 shadcn", "2026 Juber Shaikh (Hostlelo)"]
SPDX-License-Identifier = "MIT AND AGPL-3.0-only"

# Inter font files and the font licence copied with them.
[[annotations]]
path = ["assets/brand/fonts/**", "assets/brand/licenses/inter-OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

# Lucide interface icons copied by scripts/brand-build.mjs.
[[annotations]]
path = "assets/brand/icons/ui-*.svg"
precedence = "override"
SPDX-FileCopyrightText = "2026 Lucide Icons and Contributors"
SPDX-License-Identifier = "ISC"

# Lucide icons derived from Feather, and Lucide's licence file, which holds
# both licences.
[[annotations]]
path = [
  "assets/brand/icons/ui-database.svg",
  "assets/brand/icons/ui-server.svg",
  "assets/brand/icons/ui-terminal.svg",
  "assets/brand/licenses/lucide-LICENSE.txt",
]
precedence = "override"
SPDX-FileCopyrightText = ["2026 Lucide Icons and Contributors", "2013 Cole Bemis"]
SPDX-License-Identifier = "ISC AND MIT"

# The .htaccess file the Akismet WordPress plugin 5.7.2 ships, kept byte
# for byte as a test input.
[[annotations]]
path = "internal/htaccess/testdata/akismet-5.7.2.htaccess"
precedence = "override"
SPDX-FileCopyrightText = "Automattic, Inc."
SPDX-License-Identifier = "GPL-2.0-or-later"

# The Contributor Covenant 2.1 text.
[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = "Contributor Covenant (https://www.contributor-covenant.org)"
SPDX-License-Identifier = "CC-BY-4.0"
