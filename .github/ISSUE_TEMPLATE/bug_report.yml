name: Bug report
description: Something in Sifruno does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, do not use this form: follow SECURITY.md instead.
        Remove server addresses, domain names, passwords, keys and customer data from anything you paste.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Websites and choose New website
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sifruno version
      description: The commit you built from (git rev-parse --short HEAD) or the release.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it runs
      options:
        - Installed on an AlmaLinux 9 server
        - The dev VM (scripts/devvm)
        - From source on my own machine
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: For example journalctl -u sifruno or journalctl -u sifruno-broker, with secrets removed.
      render: text
