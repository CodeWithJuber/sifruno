name: Source checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.event.pull_request.number || github.ref }}
  # A new push to a pull request cancels its older run; runs on main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# GitHub-hosted runners only: this repository is public, so a pull request's
# code must never run on our own machines (scripts/ci/public-repo-guard.sh).
# These checks do not activate hosting, call paid providers, deploy a preview,
# qualify native daemons or certify parity.

jobs:
  workflows:
    name: Workflow rules for a public repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Workflows use GitHub-hosted runners and pinned actions
        run: bash scripts/ci/public-repo-guard.sh

  go:
    name: Go build, vet and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version: '1.27.1'
      - name: Go vet
        run: go vet ./...
      - name: Go tests
        run: |
          # The process test rebuilds with -trimpath under a short startup deadline,
          # so prime the compiler cache first. One hostaccounts fixture needs the
          # default umask (AGENTS.md).
          umask 022
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/sifruno-ci" ./cmd/sifruno
          go test ./... -count=1 -timeout 30m

  web:
    name: UI build, Node tests and packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: '24.19.0'
      - name: Install pinned development dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix web ci --ignore-scripts --no-audit --no-fund
      - name: UI typecheck and build
        run: |
          npm run panel:typecheck
          npm run panel:build
      - name: Node tests (UI contracts, scripts and lab harness reports)
        run: node --test web/src/lib/*.test.mjs scripts/*.test.mjs lab/*/*.test.mjs
      - name: Approved brand integrity
        run: npm run brand:check
      - name: Packaging and whitespace checks
        run: |
          node scripts/build-runtime.mjs --self-check
          node scripts/package-source.mjs
          git diff --check

  python:
    name: Python fixture tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python fixture tests
        run: |
          python3 -m unittest discover -s lab -p test_capture.py
          python3 -m unittest discover -s lab/hostweb-review -p test_web_runtime_fixture.py
          python3 -m unittest discover -s lab -p test_web_package_prepare.py
          python3 lab/native-restore-preview-review/prepare_test.py
          python3 -m unittest discover -s lab/broker-paths-guest -p fixture_test.py
          python3 -m unittest discover -s lab/stock-policy-guest -p fixture_test.py
          python3 -m unittest discover -s lab/hostwebruntime-crash-guest -p test_guest.py
          python3 -m unittest discover -s lab/hostwebruntime-mechanics -p test_guest.py
          python3 -m unittest discover -s lab/hostwebruntime-serving-guest -p test_serving_guest.py
          python3 -m unittest discover -s scripts/recovery -p test_restore_files.py

  reuse:
    name: REUSE licensing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every file has copyright and licence information
        # Runs reuse lint (its default command) in the fsfe/reuse:6 image.
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
