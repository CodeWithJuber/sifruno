# Generated by Sifruno from its site database. Do not edit: the next render replaces this file.
# Included from httpd_config.conf by: include /usr/local/lsws/conf/sifruno.conf

virtualhost sifruno-paused {
  vhRoot                  /var/lib/sifruno-suspended/
  configFile              /usr/local/lsws/conf/vhosts/sifruno-paused/vhconf.conf
  allowSymbolLink         1
  enableScript            0
  restrained              1
  setUIDMode              2
  user                    pauseduser
  group                   pauseduser
}

virtualhost sifruno-shop {
  vhRoot                  /home/shopowner/
  configFile              /usr/local/lsws/conf/vhosts/sifruno-shop/vhconf.conf
  allowSymbolLink         1
  enableScript            1
  restrained              1
  setUIDMode              2
  user                    shopowner
  group                   shopowner
}

listener sifruno-http {
  address                 *:80
  secure                  0
  map                     sifruno-paused paused.example.org, www.paused.example.org
  map                     sifruno-shop example.com, example.net, shop.example.com, www.example.com
}

listener sifruno-https {
  address                 *:443
  secure                  1
  keyFile                 /etc/sifruno/tls/listener.key
  certFile                /etc/sifruno/tls/listener.crt
  certChain               1
  map                     sifruno-paused paused.example.org, www.paused.example.org
  map                     sifruno-shop example.com, shop.example.com, www.example.com
}
