# Generated by Sifruno from its site database. Do not edit: the next render replaces this file.
# Site blog (active), user blogowner, PHP 8.3

docRoot                   /home/blogowner/public_html/
namespace                 2
cgroups                   2

index  {
  useServer               0
  indexFiles              index.php, index.html
  autoIndex               0
}

errorlog /usr/local/lsws/logs/sifruno/blog/error.log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
  keepDays                30
}

accesslog /usr/local/lsws/logs/sifruno/blog/access.log {
  useServer               0
  logReferer              1
  logUserAgent            1
  rollingSize             10M
  keepDays                30
  compressArchive         0
}

extprocessor sifruno-blog {
  type                    lsapi
  address                 uds://tmp/lshttpd/sifruno-blog.sock
  maxConns                4
  env                     PHP_LSAPI_CHILDREN=4
  env                     LSAPI_AVOID_FORK=200M
  initTimeout             60
  retryTimeout            0
  persistConn             1
  respBuffer              0
  autoStart               2
  path                    /usr/local/lsws/lsphp83/bin/lsphp
  backlog                 100
  instances               1
  runOnStartUp            0
  extUser                 blogowner
  extGroup                blogowner
  priority                0
  memSoftLimit            2047M
  memHardLimit            2047M
  procSoftLimit           1000
  procHardLimit           1000
}

scripthandler  {
  add                     lsapi:sifruno-blog php
}

module cache {
  ls_enabled              1
  storagePath             /var/lib/sifruno-lscache/sifruno-blog
  checkPublicCache        1
  checkPrivateCache       1
  enableCache             0
  enablePrivateCache      0
  qsCache                 1
  reqCookieCache          1
  respCookieCache         1
  ignoreReqCacheCtrl      1
  ignoreRespCacheCtrl     0
  expireInSeconds         3600
  privateExpireInSeconds  3600
  maxStaleAge             200
  maxCacheObjSize         10000000
}

context /.well-known/acme-challenge/ {
  location                /var/lib/sifruno-acme/
  allowBrowse             1
  autoIndex               0
  forceType               text/plain
  rewrite  {
    enable                0
  }
}

realm sifruno-realm2 {
  userDB  {
    location              /var/lib/sifruno-realms/blog/realm2.htpasswd
  }
}

context exp:(?s)^/(?![.]well-known/acme-challenge/[-_A-Za-z0-9]+(?!.))(?:(?:.*/)?(?:[.]htaccess|[.]user[.]ini|readme[.]html|wp-config[.]php|xmlrpc[.]php|[^/]*[.]sql)(?:/.*)?)[[:cntrl:]]?(?!.) {
  location                /var/lib/sifruno-suspended/
  allowBrowse             0
  rewrite  {
    enable                0
  }
}

context exp:(?s)^/members/(?:(?:.*/)?(?:[.]htpasswd)(?:/.*)?)[[:cntrl:]]?(?!.) {
  location                /var/lib/sifruno-suspended/
  allowBrowse             0
  rewrite  {
    enable                0
  }
}

context exp:(?s)^/wp-content/uploads/(?:(?:.*/)?(?:[^/]*[.]php)(?:/.*)?|(?:.*/)?)[[:cntrl:]]?(?!.) {
  location                /var/lib/sifruno-suspended/
  allowBrowse             0
  rewrite  {
    enable                0
  }
}

context exp:(?s)^/members/.* {
  allowBrowse             1
  realm                   sifruno-realm2
  authName                Members only
  required                valid-user
  accessControl  {
    allow                 ALL
  }
  rewrite  {
    enable                0
  }
}

context exp:(?s)^/private/.* {
  location                /var/lib/sifruno-suspended/
  allowBrowse             0
  rewrite  {
    enable                0
  }
}

errorPage 403 {
  url                     /errors/403.html
}

errorPage 404 {
  url                     /404.html
}

rewrite  {
  enable                  1
  autoLoadHtaccess        1
  rules                   <<<END_rules
RewriteRule (^|/)\.(ht|git|svn|hg) - [F,L,NC]
RewriteRule (^|/)\.env - [F,L,NC]
RewriteRule (^|/)\.user\.ini$ - [F,L,NC]
RewriteRule \.(phtml|pht|phar|phps|php[0-9]+)$ - [F,L,NC]
RewriteRule (\.(bak|orig|save|sql)|~)$ - [F,L,NC]
RewriteRule (^|/)\.?wp-config\.php(~|\.[^/]*)$ - [F,L,NC]
RewriteRule (^|/)wp-config\.(bak|old|orig|save|swp|txt)$ - [F,L,NC]
RewriteRule (^|/)wp-content/debug\.log$ - [F,L,NC]
RewriteRule ^/?shop/?$ https://shop.example.com/ [R=302,L]
RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
RewriteRule ^/?old-page(/.*)?$ https://example.com/new-page$1 [R=301,L]
RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
RewriteRule ^/?docs/(.*)$ /manual/$1 [R=302,L]
RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
RewriteRule ^/blog/([0-9]+)/(.*)$ /news/$2?id=$1 [R=301,L]
  END_rules
}
