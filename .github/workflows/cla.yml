name: CLA

# Asks each contributor to sign CLA.md once, by commenting on their pull
# request, and records the signature in the cla-signatures branch. LICENSING.md
# explains why. This is the repository's only pull_request_target workflow: it
# needs a write token to comment, set the status and commit signatures, so it
# never checks out or runs the pull request's code (scripts/ci/public-repo-guard.sh
# enforces that).
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  contents: read

jobs:
  cla:
    name: Contributor License Agreement
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Check that every committer has signed
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/CodeWithJuber/sifruno/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: CodeWithJuber,dependabot[bot],github-actions[bot],*[bot]
