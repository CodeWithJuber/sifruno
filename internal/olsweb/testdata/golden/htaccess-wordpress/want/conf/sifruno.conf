# Generated by Sifruno from its site database. Do not edit: the next render replaces this file.
# Included from httpd_config.conf by: include /usr/local/lsws/conf/sifruno.conf

virtualhost sifruno-blog {
  vhRoot                  /home/blogowner/
  configFile              /usr/local/lsws/conf/vhosts/sifruno-blog/vhconf.conf
  allowSymbolLink         1
  enableScript            1
  restrained              1
  setUIDMode              2
  user                    blogowner
  group                   blogowner
}

virtualhost sifruno-paused {
  vhRoot                  /var/lib/sifruno-suspended/
  configFile              /usr/local/lsws/conf/vhosts/sifruno-paused/vhconf.conf
  allowSymbolLink         1
  enableScript            0
  restrained              1
  setUIDMode              2
  user                    pauseduser
  group                   pauseduser
}

listener sifruno-http {
  address                 *:80
  secure                  0
  map                     sifruno-blog example.com, www.example.com
  map                     sifruno-paused paused.example.org
}
