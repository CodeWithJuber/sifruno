# Generated by Sifruno from its site database. Do not edit: the next render replaces this file.
# Site shop (active), user shopowner, PHP 8.3

docRoot                   /home/shopowner/public_html/
namespace                 2
cgroups                   2

index  {
  useServer               0
  indexFiles              index.php, index.html
  autoIndex               0
}

errorlog /usr/local/lsws/logs/sifruno/shop/error.log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
  keepDays                30
}

accesslog /usr/local/lsws/logs/sifruno/shop/access.log {
  useServer               0
  logReferer              1
  logUserAgent            1
  rollingSize             10M
  keepDays                30
  compressArchive         0
}

vhssl  {
  keyFile                 /etc/sifruno/tls/shop/key.pem
  certFile                /etc/sifruno/tls/shop/cert.pem
  certChain               1
}

extprocessor sifruno-shop {
  type                    lsapi
  address                 uds://tmp/lshttpd/sifruno-shop.sock
  maxConns                4
  env                     PHP_LSAPI_CHILDREN=4
  env                     LSAPI_AVOID_FORK=200M
  initTimeout             60
  retryTimeout            0
  persistConn             1
  respBuffer              0
  autoStart               2
  path                    /usr/local/lsws/lsphp83/bin/lsphp
  backlog                 100
  instances               1
  runOnStartUp            0
  extUser                 shopowner
  extGroup                shopowner
  priority                0
  memSoftLimit            2047M
  memHardLimit            2047M
  procSoftLimit           1000
  procHardLimit           1000
}

scripthandler  {
  add                     lsapi:sifruno-shop php
}

module cache {
  ls_enabled              1
  storagePath             /var/lib/sifruno-lscache/sifruno-shop
  checkPublicCache        1
  checkPrivateCache       1
  enableCache             0
  enablePrivateCache      0
  qsCache                 1
  reqCookieCache          1
  respCookieCache         1
  ignoreReqCacheCtrl      1
  ignoreRespCacheCtrl     0
  expireInSeconds         3600
  privateExpireInSeconds  3600
  maxStaleAge             200
  maxCacheObjSize         10000000
}

context /.well-known/acme-challenge/ {
  location                /var/lib/sifruno-acme/
  allowBrowse             1
  autoIndex               0
  forceType               text/plain
  rewrite  {
    enable                0
  }
}

rewrite  {
  enable                  1
  autoLoadHtaccess        1
  rules                   <<<END_rules
RewriteRule (^|/)\.(ht|git|svn|hg) - [F,L,NC]
RewriteRule (^|/)\.env - [F,L,NC]
RewriteRule (^|/)\.user\.ini$ - [F,L,NC]
RewriteRule \.(phtml|pht|phar|phps|php[0-9]+)$ - [F,L,NC]
RewriteRule (^|/)\.?wp-config\.php(~|\.[^/]*)$ - [F,L,NC]
RewriteRule (^|/)wp-config\.(bak|old|orig|save|swp|txt)$ - [F,L,NC]
RewriteRule (^|/)wp-content/debug\.log$ - [F,L,NC]
RewriteCond %{HTTP_HOST} ^example\.net(:[0-9]+)?$ [NC]
RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
RewriteRule ^/?(.*)$ http://example.com:8080/$1 [R=302,L]
RewriteCond %{HTTP_HOST} ^www\.example\.com(:[0-9]+)?$ [NC]
RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
RewriteRule ^/?(.*)$ https://example.com/$1 [R=301,L]
RewriteRule ^/?$ https://example.com/start [R=302,L]
RewriteRule ^/?blog/$ https://blog.example.org/?from=shop&lang=en [R=302,L]
RewriteRule ^/?old-page/?$ https://example.com/new-page [R=301,L]
RewriteCond %{HTTPS} !on
RewriteCond %{HTTP_HOST} ^example\.com(:[0-9]+)?$ [NC]
RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
RewriteRule ^/?(.*)$ https://example.com/$1 [R=301,L]
RewriteCond %{HTTPS} !on
RewriteCond %{HTTP_HOST} ^shop\.example\.com(:[0-9]+)?$ [NC]
RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
RewriteRule ^/?(.*)$ https://shop.example.com/$1 [R=301,L]
RewriteCond %{HTTPS} !on
RewriteCond %{HTTP_HOST} ^www\.example\.com(:[0-9]+)?$ [NC]
RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
RewriteRule ^/?(.*)$ https://www.example.com/$1 [R=301,L]
  END_rules
}
