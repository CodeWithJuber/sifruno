# Generated by Sifruno from its site database. Do not edit: the next render replaces this file.
# Site legacy (active), user legacyapp, PHP 8.1

docRoot                   /home/legacyapp/www/htdocs/

index  {
  useServer               0
  indexFiles              index.php, index.html
  autoIndex               0
}

errorlog /usr/local/lsws/logs/sifruno/legacy/error.log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
  keepDays                30
}

accesslog /usr/local/lsws/logs/sifruno/legacy/access.log {
  useServer               0
  logReferer              1
  logUserAgent            1
  rollingSize             10M
  keepDays                30
  compressArchive         0
}

extprocessor sifruno-legacy {
  type                    lsapi
  address                 uds://tmp/lshttpd/sifruno-legacy.sock
  maxConns                2
  env                     PHP_LSAPI_CHILDREN=2
  env                     LSAPI_AVOID_FORK=200M
  initTimeout             60
  retryTimeout            0
  persistConn             1
  respBuffer              0
  autoStart               2
  path                    /usr/local/lsws/lsphp81/bin/lsphp
  backlog                 100
  instances               1
  runOnStartUp            0
  extUser                 legacyapp
  extGroup                legacyapp
  priority                0
  memSoftLimit            2047M
  memHardLimit            2047M
  procSoftLimit           1000
  procHardLimit           1000
}

scripthandler  {
  add                     lsapi:sifruno-legacy php
}

module cache {
  ls_enabled              1
  storagePath             /var/lib/sifruno-lscache/sifruno-legacy
  checkPublicCache        1
  checkPrivateCache       1
  enableCache             0
  enablePrivateCache      0
  qsCache                 1
  reqCookieCache          1
  respCookieCache         1
  ignoreReqCacheCtrl      1
  ignoreRespCacheCtrl     0
  expireInSeconds         3600
  privateExpireInSeconds  3600
  maxStaleAge             200
  maxCacheObjSize         10000000
}

context /.well-known/acme-challenge/ {
  location                /var/lib/sifruno-acme/
  allowBrowse             1
  autoIndex               0
  forceType               text/plain
  rewrite  {
    enable                0
  }
}

rewrite  {
  enable                  1
  autoLoadHtaccess        1
  rules                   <<<END_rules
RewriteRule (^|/)\.(ht|git|svn|hg) - [F,L,NC]
RewriteRule (^|/)\.env - [F,L,NC]
RewriteRule (^|/)\.user\.ini$ - [F,L,NC]
RewriteRule (^|/)\.?wp-config\.php(~|\.[^/]*)$ - [F,L,NC]
RewriteRule (^|/)wp-config\.(bak|old|orig|save|swp|txt)$ - [F,L,NC]
RewriteRule (^|/)wp-content/debug\.log$ - [F,L,NC]
  END_rules
}
