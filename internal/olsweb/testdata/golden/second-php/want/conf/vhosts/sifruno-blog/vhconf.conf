# Generated by Sifruno from its site database. Do not edit: the next render replaces this file.
# Site blog (active), user blogowner, PHP 8.3

docRoot                   /home/blogowner/public_html/

index  {
  useServer               0
  indexFiles              index.php, index.html
  autoIndex               0
}

errorlog /usr/local/lsws/logs/sifruno/blog/error.log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
  keepDays                30
}

accesslog /usr/local/lsws/logs/sifruno/blog/access.log {
  useServer               0
  logReferer              1
  logUserAgent            1
  rollingSize             10M
  keepDays                30
  compressArchive         0
}

vhssl  {
  keyFile                 /etc/sifruno/tls/blog/privkey.pem
  certFile                /etc/sifruno/tls/blog/fullchain.pem
  certChain               1
}

extprocessor sifruno-blog {
  type                    lsapi
  address                 uds://tmp/lshttpd/sifruno-blog.sock
  maxConns                10
  env                     PHP_LSAPI_CHILDREN=10
  env                     LSAPI_AVOID_FORK=200M
  initTimeout             60
  retryTimeout            0
  persistConn             1
  respBuffer              0
  autoStart               2
  path                    /usr/local/lsws/lsphp83/bin/lsphp
  backlog                 100
  instances               1
  runOnStartUp            0
  extUser                 blogowner
  extGroup                blogowner
  priority                0
  memSoftLimit            2047M
  memHardLimit            2047M
  procSoftLimit           1000
  procHardLimit           1000
}

scripthandler  {
  add                     lsapi:sifruno-blog php
}

rewrite  {
  enable                  1
  autoLoadHtaccess        1
  rules                   <<<END_rules
RewriteRule (^|/)\.(ht|git|svn|hg) - [F,L,NC]
RewriteRule (^|/)\.env - [F,L,NC]
RewriteRule (^|/)\.user\.ini$ - [F,L,NC]
RewriteRule (^|/)\.?wp-config\.php(~|\.[^/]*)$ - [F,L,NC]
RewriteRule (^|/)wp-config\.(bak|old|orig|save|swp|txt)$ - [F,L,NC]
RewriteRule (^|/)wp-content/debug\.log$ - [F,L,NC]
  END_rules
}
