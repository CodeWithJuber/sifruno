name: Secret scan

# gitleaks scans the commits of each pull request and push. The default rules
# apply, with the false positives .gitleaks.toml names. A finding fails the
# run; its value is redacted in the log, and nothing is uploaded or commented,
# because this repository and its run results are public. If a real secret is
# found, revoke it first: removing the commit does not take it back.
on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: No secrets in new commits
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Lets the action list a pull request's commits.
      pull-requests: read
    steps:
      - name: Check out source with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A personal account needs no GITLEAKS_LICENSE; an organization does.
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
