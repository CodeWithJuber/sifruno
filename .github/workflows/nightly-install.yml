name: Nightly fresh install

# The Phase 1 item "an installer that is tested every night on a fresh VM"
# (decision D-0006). Each night this job builds the release, creates a
# throwaway Linode (AlmaLinux 9, /home on its own XFS disk with quota, a Cloud
# Firewall that admits SSH from this runner only), runs
# scripts/devvm/fresh-install-test.sh --existing-host on it, and deletes the
# Linode and the firewall whatever happened. The logic is in
# scripts/ci/nightly-fresh-install.sh, which also runs by hand.
#
# Transcripts stay on the runner's server, in
# $CI_RESULTS_DIR/RUN_ID-RUN_ATTEMPT/: nightly-RUN_ID-RUN_ATTEMPT.txt (the
# whole run, with the deletion check) and fresh-install-*.txt (the test).
#
# Turning it on and off
#   The test runs only when the repository secret SIFRUNO_NIGHTLY_LINODE_TOKEN
#   exists. Adding it is the owner's approval to spend: one started hour of a
#   g6-standard-2 Linode a night, $0.036 on 2026-11-25 (about $1.10 a month).
#   Without it the job prints one line saying the test is off, and passes.
#   1. Cloud Manager, your profile, API Tokens, Create a Personal Access
#      Token. Label sifruno-nightly. Scopes: Linodes Read/Write and Firewalls
#      Read/Write; every other scope No Access. Those two cover everything the
#      script calls: Linodes, their disks, configuration profiles, boot and
#      delete, and the firewall and its attachment. Pick an expiry and renew
#      the secret before it.
#   2. GitHub, this repository, Settings, Secrets and variables, Actions, New
#      repository secret: name SIFRUNO_NIGHTLY_LINODE_TOKEN, the token as value.
#   Delete the secret to turn the test off; revoke the token in Cloud Manager
#   to take its access away.
#
# The schedule runs from the default branch only, so it starts once this file
# is on main. Run it at any time from the Actions tab (Run workflow).

on:
  schedule:
    # 22:23 UTC is 02:23 in Dubai (Asia/Dubai is UTC+4 all year).
    - cron: '23 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-install
  # A run in progress finishes, so that its own cleanup runs.
  cancel-in-progress: false

jobs:
  fresh-install:
    name: Fresh install on a throwaway Linode
    # The owner's runner (github-runners kit); see source-checks.yml.
    runs-on: [self-hosted, linux, x64, sifruno]
    timeout-minutes: 130
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Workflows use nothing GitHub bills for
        run: bash scripts/ci/no-github-billing.sh
      - name: Is the test turned on?
        id: gate
        env:
          SIFRUNO_NIGHTLY_LINODE_TOKEN: ${{ secrets.SIFRUNO_NIGHTLY_LINODE_TOKEN }}
        run: |
          if [ -n "$SIFRUNO_NIGHTLY_LINODE_TOKEN" ]; then
            echo on=true >>"$GITHUB_OUTPUT"
          else
            echo 'The nightly fresh-install test is off. To turn it on, add the repository secret SIFRUNO_NIGHTLY_LINODE_TOKEN holding a Linode token, as the top of .github/workflows/nightly-install.yml explains.'
            echo on=false >>"$GITHUB_OUTPUT"
          fi
      - name: Set up Go
        if: steps.gate.outputs.on == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version: '1.27.1'
      - name: Set up Node
        if: steps.gate.outputs.on == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: '24.19.0'
      - name: Install pinned development dependencies
        if: steps.gate.outputs.on == 'true'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix web ci --ignore-scripts --no-audit --no-fund
      - name: SSH client and jq
        if: steps.gate.outputs.on == 'true'
        run: |
          # The runner image has none of the hosted image's extra tools.
          packages=()
          if ! command -v ssh >/dev/null || ! command -v scp >/dev/null || ! command -v ssh-keygen >/dev/null; then
            packages+=(openssh-client)
          fi
          if ! command -v jq >/dev/null; then
            packages+=(jq)
          fi
          if [ "${#packages[@]}" -gt 0 ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends "${packages[@]}"
          fi
      - name: Fresh install on a throwaway Linode
        if: steps.gate.outputs.on == 'true'
        timeout-minutes: 100
        env:
          SIFRUNO_NIGHTLY_LINODE_TOKEN: ${{ secrets.SIFRUNO_NIGHTLY_LINODE_TOKEN }}
        run: |
          if [ -z "${CI_RESULTS_DIR:-}" ]; then
            echo "CI_RESULTS_DIR is not set. This job needs the owner's runner (github-runners kit), which keeps results on its server." >&2
            exit 1
          fi
          export SIFRUNO_PROOF_OUT="$CI_RESULTS_DIR/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          bash scripts/ci/nightly-fresh-install.sh
      # The script deletes on every way out it sees. A step killed by its
      # timeout or a cancel gets no such chance, so this step checks again.
      - name: Delete this run's Linode and firewall if they are still there
        if: always() && steps.gate.outputs.on == 'true'
        timeout-minutes: 15
        env:
          SIFRUNO_NIGHTLY_LINODE_TOKEN: ${{ secrets.SIFRUNO_NIGHTLY_LINODE_TOKEN }}
        run: |
          if [ -n "${CI_RESULTS_DIR:-}" ]; then
            export SIFRUNO_PROOF_OUT="$CI_RESULTS_DIR/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
          bash scripts/ci/nightly-fresh-install.sh cleanup
